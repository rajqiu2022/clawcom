<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>知识分享 - OpenClaw Hub</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        * { box-sizing: border-box; }
        :root {
            --ink: #1c2922;
            --muted: #66766c;
            --paper: #fbfaf4;
            --line: #dedbce;
            --moss: #285b43;
            --gold: #d1a94b;
        }
        body {
            margin: 0;
            color: var(--ink);
            background:
                linear-gradient(90deg, rgba(40,91,67,.035) 1px, transparent 1px),
                linear-gradient(rgba(40,91,67,.035) 1px, transparent 1px),
                var(--paper);
            background-size: 26px 26px;
            font-family: "Noto Serif SC", "Source Han Serif SC", "Microsoft YaHei", serif;
            line-height: 1.75;
        }
        .topbar {
            min-height: 58px;
            padding: 12px max(22px, calc((100vw - 1040px) / 2));
            background: var(--moss);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }
        .brand { font-weight: 700; letter-spacing: .08em; }
        .topbar a { color: #fff; text-decoration: none; font-size: 13px; opacity: .9; }
        main { max-width: 920px; margin: 0 auto; padding: 58px 24px 88px; }
        .eyebrow { color: var(--moss); font-size: 12px; font-weight: 700; letter-spacing: .2em; }
        h1 { margin: 10px 0 12px; font-size: clamp(30px, 5vw, 48px); line-height: 1.2; letter-spacing: -.02em; }
        .meta { color: var(--muted); display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 13px; }
        .actions { margin: 26px 0 34px; }
        .download {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 15px; border: 1px solid var(--moss); border-radius: 5px;
            color: var(--moss); text-decoration: none; font: 600 13px "Microsoft YaHei", sans-serif;
            background: rgba(255,255,255,.65);
        }
        .download:hover { color: #fff; background: var(--moss); }
        .rule { height: 3px; background: linear-gradient(90deg, var(--gold) 0 72px, var(--line) 72px); margin-bottom: 34px; }
        .markdown-body { font-size: 16px; overflow-wrap: anywhere; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 1.8em; line-height: 1.35; color: var(--moss); }
        .markdown-body pre { overflow: auto; background: #18221d; color: #e5eee9; padding: 16px; border-radius: 6px; }
        .markdown-body code { background: rgba(40,91,67,.08); padding: 2px 5px; border-radius: 3px; }
        .markdown-body pre code { background: none; padding: 0; }
        .markdown-body blockquote { border-left: 3px solid var(--gold); margin-left: 0; padding: 4px 18px; color: var(--muted); }
        .markdown-body table { border-collapse: collapse; width: 100%; }
        .markdown-body th, .markdown-body td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
        .state { text-align: center; padding: 90px 20px; color: var(--muted); }
        footer { margin-top: 72px; border-top: 1px solid var(--line); padding-top: 18px; color: #89958d; font-size: 12px; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">OPENCLAW · KNOWLEDGE</div>
        <a href="/" target="_blank" rel="noopener">访问 Hub →</a>
    </div>
    <main id="content"><div class="state">正在展开知识页…</div></main>

    <script src="{{ url_for('static', filename='vendor/marked.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
    <script>
        const TOKEN = {{ share_token | tojson }};
        const API_URL = '/api/v1/knowledge/shared/' + encodeURIComponent(TOKEN);
        const EXPORT_URL = API_URL + '/export.md';

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function renderMarkdown(text) {
            try {
                return DOMPurify.sanitize(marked.parse(text || '', { breaks: true, gfm: true }));
            } catch (_) {
                return '<pre>' + escapeHtml(text || '') + '</pre>';
            }
        }
        function renderEntry(entry) {
            const meta = [
                entry.category && `分类：${entry.category}`,
                entry.project_name && `项目：${entry.project_name}`,
                entry.module_name && `模块：${entry.module_name}`,
                entry.created_by && `整理者：${entry.created_by}`,
                entry.updated_at && `更新：${String(entry.updated_at).slice(0, 16)}`,
            ].filter(Boolean);
            document.getElementById('content').innerHTML = `
                <div class="eyebrow">ANONYMOUS KNOWLEDGE SHARE</div>
                <h1>${escapeHtml(entry.title || '未命名知识')}</h1>
                <div class="meta">${meta.map(item => `<span>${escapeHtml(item)}</span>`).join('')}</div>
                <div class="actions">
                    <a class="download" href="${EXPORT_URL}">↓ 下载 Markdown</a>
                </div>
                <div class="rule"></div>
                <article class="markdown-body">${renderMarkdown(entry.content)}</article>
                <footer>此页面由 OpenClaw Hub 知识库匿名分享链接生成，仅提供只读内容。</footer>`;
            document.title = (entry.title || '知识分享') + ' - OpenClaw Hub';
        }
        (async function load() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    let message = '分享链接不存在或已失效';
                    try {
                        const body = await response.json();
                        if (body.error) message = body.error;
                    } catch (_) {}
                    throw new Error(message);
                }
                renderEntry(await response.json());
            } catch (error) {
                document.getElementById('content').innerHTML =
                    `<div class="state"><h2>无法打开知识</h2><p>${escapeHtml(error.message)}</p></div>`;
            }
        })();
    </script>
</body>
</html>
