<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawTeam 管理系统 - 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260418c">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c2410c'/><path fill='%23ffffff' d='M16 6c-5.523 0-10 4.477-10 10s4.477 10 10 10c2.652 0 5.06-1.033 6.85-2.717l-3.55-3.55c-.93.79-2.13 1.267-3.45 1.267-2.946 0-5.333-2.387-5.333-5.333s2.387-5.333 5.333-5.333c1.32 0 2.52.477 3.45 1.267l3.55-3.55C21.06 7.033 18.652 6 16 6z'/></svg>">
    <script>
    (function(){ try { var t = localStorage.getItem('openclaw-theme'); if (t==='light'||t==='dark') document.documentElement.setAttribute('data-theme', t); } catch(e){} })();
    </script>
    <style>
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-primary);
            background-image:
                radial-gradient(circle at 18% 12%, var(--accent-soft) 0, transparent 38%),
                radial-gradient(circle at 82% 88%, var(--rose-soft) 0, transparent 42%);
        }
        .login-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px 36px 32px;
            width: 400px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }
        .login-logo { text-align: center; margin-bottom: 18px; display: flex; justify-content: center; }
        .login-logo .brand-badge {
            width: 56px; height: 56px;
            border-radius: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 20px var(--accent-glow);
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
        }
        .login-logo .brand-badge svg { width: 56px; height: 56px; }
        .login-title {
            text-align: center;
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 1.6rem; font-weight: 600;
            margin-bottom: 4px; letter-spacing: -0.005em;
            color: var(--text-primary);
        }
        .login-subtitle {
            text-align: center;
            font-size: 0.78rem; color: var(--text-muted);
            margin-bottom: 28px;
            letter-spacing: 0.04em;
        }
        .btn-login {
            width: 100%; padding: 11px 16px;
            background: var(--accent); color: var(--accent-fg, #fff);
            border: none; border-radius: 8px;
            font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.18s;
            margin-top: 6px; font-family: inherit;
            box-shadow: 0 1px 2px var(--accent-glow);
        }
        .btn-login:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
        .toggle-mode { text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--text-muted); }
        .toggle-mode a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 500; }
        .toggle-mode a:hover { color: var(--accent-hover); }
        .error-msg { color: var(--red); font-size: 0.85rem; margin-top: 8px; text-align: center; display: none; }
        .display-name-group { display: none; }
        .theme-mini {
            position: fixed; top: 18px; right: 18px;
        }
    </style>
</head>
<body>
<button type="button" class="theme-toggle theme-mini" onclick="toggleTheme()" title="切换主题">
    <span id="theme-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </span>
    <span id="theme-label">浅色</span>
</button>
<div class="login-card">
    <div class="login-logo">
        <span class="brand-badge" aria-hidden="true">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="8" fill="transparent"/>
                <path fill="#ffffff" d="M16 6c-5.523 0-10 4.477-10 10s4.477 10 10 10c2.652 0 5.06-1.033 6.85-2.717l-3.55-3.55c-.93.79-2.13 1.267-3.45 1.267-2.946 0-5.333-2.387-5.333-5.333s2.387-5.333 5.333-5.333c1.32 0 2.52.477 3.45 1.267l3.55-3.55C21.06 7.033 18.652 6 16 6z"/>
            </svg>
        </span>
    </div>
    <div class="login-title display" id="page-title">登录 ClawTeam</div>
    <div class="login-subtitle">天美J1·质量管理一组</div>

    <div class="error-msg" id="sso-error-msg" style="display:none;margin-bottom:14px;text-align:left"></div>

    <form id="auth-form">
        <div class="form-group">
            <label class="form-label">用户名</label>
            <input class="form-input" id="username" placeholder="输入用户名" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label">密码</label>
            <input class="form-input" type="password" id="password" placeholder="输入密码" required>
        </div>
        <div class="form-group display-name-group" id="display-name-group">
            <label class="form-label">显示名称（可选）</label>
            <input class="form-input" id="display-name" placeholder="你的昵称">
        </div>
        <div class="error-msg" id="error-msg"></div>
        <button class="btn-login" type="submit" id="submit-btn">登录</button>
    </form>

    <div class="toggle-mode">
        <span id="toggle-text">还没有账号？</span>
        <a id="toggle-link" onclick="toggleMode()">注册</a>
    </div>

    <div style="margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center;">
        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;">或使用企业账号登录</div>
        <a href="/login/woa" class="btn-login" style="display: inline-block; text-decoration: none; text-align: center; background: linear-gradient(135deg, #1a73e8, #0d47a1); box-shadow: 0 1px 2px rgba(26,115,232,0.3);">
            WOA 企业账号登录
        </a>
    </div>
    <div id="bypass-tip" style="margin-top:14px;padding:8px 10px;background:rgba(234,179,8,0.10);border:1px solid rgba(234,179,8,0.25);border-radius:8px;font-size:0.72rem;color:#a16207;display:none;line-height:1.55">
        🔧 <b>NGN 旁路模式已开启</b> —— 用上方"用户名+密码"登录到任意账号都不会被 OA 自动覆盖。<br>
        测试完成后访问 <code>/logout</code> 即可恢复正常 OA 自动登录。
    </div>
</div>

<script>
// 主题切换（与 base.html 保持一致）
function getEffectiveTheme(){
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'light' || t === 'dark') return t;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function updateThemeButton(){
    var label = document.getElementById('theme-label');
    var icon  = document.getElementById('theme-icon');
    if (!label || !icon) return;
    var eff = getEffectiveTheme();
    if (eff === 'dark') {
        label.textContent = '深色';
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    } else {
        label.textContent = '浅色';
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    }
}
function toggleTheme(){
    var next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('openclaw-theme', next); } catch(e){}
    updateThemeButton();
}
document.addEventListener('DOMContentLoaded', updateThemeButton);

// 显示 OA/WOA 单点登录回调的错误（由 /api/v1/auth/woa-callback 失败时
// redirect 回 /login?sso_error=xxx&msg=...）
// 同时处理 /logout 完成后回跳的 ?logout=1 标记
(function showSsoError(){
    try {
        const qs = new URLSearchParams(window.location.search);
        const box = document.getElementById('sso-error-msg');

        if (qs.get('logout') === '1') {
            box.style.background = '#e6f7ff';
            box.style.color = '#0958d9';
            box.style.border = '1px solid #91caff';
            box.textContent = '已成功退出登录。如需重新进入，请点击下方"WOA 登录"。';
            box.style.display = '';
        }
        // NGN 旁路模式提示
        if (qs.get('bypass_ngn') === '1') {
            const tip = document.getElementById('bypass-tip');
            if (tip) tip.style.display = '';
            // 也修改主标题让我自己一眼看出来当前在测试模式
            const title = document.getElementById('page-title');
            if (title) title.textContent = '🔧 测试登录（NGN 旁路）';
        }

        const code = qs.get('sso_error');
        if (!code) return;
        const msgRaw = qs.get('msg') || '';
        const codeMap = {
            'missing_ticket': '缺少 ticket 参数',
            'decrypt_failed': '票据解密失败（请重新点击 WOA 登录）',
            'no_username': 'passport 未返回用户名',
            'sso_failed': 'SSO 登录失败',
        };
        const label = codeMap[code] || ('SSO 错误:' + code);
        box.textContent = label + (msgRaw ? '（' + decodeURIComponent(msgRaw) + '）' : '');
        box.style.display = '';
    } catch (e) {}
})();

let isRegister = false;

function toggleMode() {
    isRegister = !isRegister;
    document.getElementById('page-title').textContent = isRegister ? '注册 ClawTeam' : '登录 ClawTeam';
    document.getElementById('submit-btn').textContent = isRegister ? '注册' : '登录';
    document.getElementById('toggle-text').textContent = isRegister ? '已有账号？' : '还没有账号？';
    document.getElementById('toggle-link').textContent = isRegister ? '登录' : '注册';
    document.getElementById('display-name-group').style.display = isRegister ? '' : 'none';
    document.getElementById('error-msg').style.display = 'none';
}

document.getElementById('auth-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('error-msg');
    errEl.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const displayName = document.getElementById('display-name').value.trim();

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;

    try {
        const url = isRegister ? '/api/v1/auth/register' : '/api/v1/auth/login';
        const body = { username, password };
        if (isRegister && displayName) body.display_name = displayName;

        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const data = await resp.json();

        if (resp.ok) {
            window.location.href = {{ ('/mobile' if session.get('post_login_redirect') == '/mobile' else '/')|tojson }};
        } else {
            errEl.textContent = data.error || '操作失败';
            errEl.style.display = '';
        }
    } catch (err) {
        errEl.textContent = '网络错误: ' + err.message;
        errEl.style.display = '';
    } finally {
        btn.disabled = false;
    }
});
</script>
</body>
</html>
