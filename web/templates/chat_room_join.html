<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Hub 外部协作聊天室</title>
    <style>
        :root{--ink:#eef7f5;--muted:#91a6a3;--line:rgba(153,203,194,.16);--mint:#55d6be;--panel:#101820;--deep:#080d12}
        *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,rgba(85,214,190,.12),transparent 32%),var(--deep);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;overflow-x:hidden}
        body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
        .shell{width:min(1180px,calc(100% - 32px));height:100dvh;min-height:0;margin:0 auto;padding:24px 0;position:relative;display:flex;flex-direction:column}.brand{display:flex;flex:0 0 auto;align-items:center;justify-content:space-between;margin-bottom:18px}.brand strong{letter-spacing:.08em}.secure{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 10px;border-radius:20px}.secure i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mint);margin-right:7px;box-shadow:0 0 10px var(--mint)}
        .join-card{width:min(470px,100%);margin:9vh auto 0;padding:34px;background:rgba(16,24,32,.94);border:1px solid var(--line);border-top:2px solid var(--mint);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.4)}.eyebrow{font-size:10px;color:var(--mint);font-weight:800;letter-spacing:.18em}.join-card h1{font-size:25px;margin:10px 0}.join-card p{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 24px}.field{display:block;font-size:12px;color:var(--muted);margin-bottom:20px}.field input{display:block;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#0a1117;color:var(--ink);padding:12px;outline:0}.field input:focus{border-color:rgba(85,214,190,.55);box-shadow:0 0 0 3px rgba(85,214,190,.07)}button{border:0;border-radius:10px;background:linear-gradient(135deg,#42c9b0,#238a78);color:#04110e;font-weight:800;padding:11px 16px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.join-card button{width:100%}.error{margin-top:14px;color:#fb7185;font-size:12px;line-height:1.5}
        .workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 260px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(13,19,25,.96);box-shadow:0 30px 80px rgba(0,0,0,.35)}.chat{display:flex;min-width:0;min-height:0;overflow:hidden;flex-direction:column}.chat-head{flex:0 0 auto;padding:17px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chat-head h1{font-size:17px;margin:0}.chat-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.ttl{font-size:10px;color:var(--muted);text-align:right}.ttl strong{display:block;color:var(--mint);font-size:11px;margin-top:3px}.stream{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(85,214,190,.48) transparent;-webkit-overflow-scrolling:touch;padding:22px;display:flex;flex-direction:column;gap:15px}.stream::-webkit-scrollbar{width:10px}.stream::-webkit-scrollbar-track{background:transparent}.stream::-webkit-scrollbar-thumb{background:rgba(85,214,190,.36);border:3px solid transparent;border-radius:10px;background-clip:padding-box}.stream:focus-visible{outline:2px solid rgba(85,214,190,.55);outline-offset:-3px}.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;max-width:80%}.msg.mine{margin-left:auto;grid-template-columns:minmax(0,1fr) 32px}.avatar{width:32px;height:32px;border-radius:9px;background:#17232d;display:grid;place-items:center;color:var(--mint);font-size:11px;font-weight:800}.msg.mine .avatar{grid-column:2}.body{min-width:0}.msg.mine .body{grid-column:1;grid-row:1;text-align:right}.meta{color:var(--muted);font-size:10px;margin-bottom:4px}.bubble{display:inline-block;text-align:left;white-space:pre-wrap;word-break:break-word;padding:9px 12px;border:1px solid var(--line);background:#141d25;border-radius:4px 12px 12px 12px;font-size:13px;line-height:1.55}.msg.mine .bubble{background:#176b5d;border-color:rgba(85,214,190,.3);border-radius:12px 4px 12px 12px}.compose{flex:0 0 auto;padding:12px 16px 15px;border-top:1px solid var(--line);background:#101820}.mentions{display:flex;gap:6px;overflow:auto;margin-bottom:7px}.chip{padding:4px 9px;border:1px solid var(--line);border-radius:20px;background:#131e26;color:var(--muted);font-size:10px;white-space:nowrap}.chip.selected{border-color:var(--mint);color:var(--mint);background:rgba(85,214,190,.08)}.compose textarea{width:100%;resize:none;border:1px solid var(--line);border-radius:10px;background:#091017;color:var(--ink);padding:11px;outline:0;font:inherit;font-size:13px}.compose-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;margin-top:8px}.side{min-height:0;border-left:1px solid var(--line);background:#101820;padding:20px;overflow:auto}.side-title{font-size:10px;color:var(--mint);letter-spacing:.16em;font-weight:800}.member{display:flex;gap:9px;align-items:center;padding:8px 0}.member-copy{min-width:0;flex:1}.member-copy strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.member-copy span{font-size:10px;color:var(--muted)}.tag{font-size:9px;color:var(--mint);border:1px solid rgba(85,214,190,.25);border-radius:5px;padding:2px 5px}.notice{margin-top:22px;padding:13px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:11px;line-height:1.6}.empty{color:var(--muted);font-size:12px;text-align:center;padding:30px}.hidden{display:none!important}@media(max-width:760px){.workspace{grid-template-columns:1fr}.side{display:none}.shell{width:100%;height:100dvh;min-height:100svh;padding:0}.brand{padding:14px;margin:0}.workspace{flex:1;min-height:0;border-radius:0}.msg{max-width:92%}}
    </style>
</head>
<body>
<div class="shell">
    <header class="brand"><strong>CLAW TEAM · HUB</strong><span class="secure"><i></i>临时身份隔离访问</span></header>
    <section class="join-card" id="joinCard">
        <span class="eyebrow">EXTERNAL COLLABORATION</span>
        <h1>加入主题聊天室</h1>
        <p>你将以临时成员身份参与讨论。身份凭据默认有效 2 天；聊天室未删除时，凭据到期后仍可续期并保留全部历史。</p>
        <label class="field">显示名称<input id="displayName" maxlength="80" autocomplete="name" placeholder="请输入你的姓名或协作身份"></label>
        <button id="joinButton" onclick="joinRoom()">确认身份并加入</button>
        <div class="error" id="joinError"></div>
    </section>
    <section class="workspace hidden" id="workspace">
        <main class="chat"><header class="chat-head"><div><h1 id="roomTitle">-</h1><p id="roomDescription">-</p></div><div class="ttl">临时凭据<strong id="tokenExpiry">-</strong></div></header><div class="stream" id="stream" tabindex="0" aria-label="聊天消息"></div><div class="compose"><div class="mentions" id="mentions"></div><textarea id="composer" rows="3" placeholder="输入消息；可选择上方成员进行 @ 提及"></textarea><div class="compose-foot"><span>Enter 发送 · Shift+Enter 换行</span><button id="sendButton" onclick="sendMessage()">发送</button></div></div></main>
        <aside class="side"><span class="side-title">PARTICIPANTS</span><div id="members"></div><div class="notice">外部 Token 只能访问当前聊天室，无法读取 Hub 的项目、工作流或其他数据。</div></aside>
    </section>
</div>
<script>
const API='/api/v1';const storeKey='hub_chat_guest_v1';let auth=null,room=null,member=null,members=[],selected=new Set(),timer=null,renderedMessageSignature='';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function inviteCode(){return new URLSearchParams(location.hash.slice(1)).get('invite')||''}
async function call(path,opt={}){opt.headers={...(opt.headers||{})};if(auth?.access_token)opt.headers.Authorization=`Bearer ${auth.access_token}`;const r=await fetch(API+path,opt);let d={};try{d=await r.json()}catch(_){}if(r.status===401&&auth?.resume_secret&&!path.includes('/renew')){await renew();return call(path,opt)}if(!r.ok)throw new Error(d.error||d.code||`HTTP ${r.status}`);return d}
function save(){localStorage.setItem(storeKey,JSON.stringify({auth,room,member}))}function clear(){localStorage.removeItem(storeKey);auth=room=member=null}
async function bootstrap(){if(!{{ 'true' if chat_room_enabled else 'false' }}){document.getElementById('joinError').textContent='聊天室能力当前未开放';return}try{const saved=JSON.parse(localStorage.getItem(storeKey)||'null');if(saved?.auth&&saved?.room&&saved?.member){auth=saved.auth;room=saved.room;member=saved.member;await loadWorkspace();}}catch(e){clear()}}
async function joinRoom(){const code=inviteCode(),name=document.getElementById('displayName').value.trim(),button=document.getElementById('joinButton');if(!code){document.getElementById('joinError').textContent='邀请链接无效或缺少邀请码';return}if(!name){document.getElementById('joinError').textContent='请输入显示名称';return}button.disabled=true;try{const d=await call('/chat-room-invites/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({invite_code:code,display_name:name})});auth={access_token:d.access_token,resume_secret:d.resume_secret,expires_at:d.expires_at};room=d.room;member=d.member;save();history.replaceState(null,'',location.pathname);await loadWorkspace()}catch(e){document.getElementById('joinError').textContent=e.message}finally{button.disabled=false}}
async function renew(){if(!auth?.resume_secret)throw new Error('临时凭据已失效，请联系房主重新邀请');const r=await fetch(API+'/chat-room-sessions/renew',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room_id:room.id,member_id:member.id,resume_secret:auth.resume_secret})});const d=await r.json();if(!r.ok){clear();throw new Error(d.error||'临时凭据续期失败')}auth.access_token=d.access_token;auth.expires_at=d.expires_at;save()}
async function loadWorkspace(){document.getElementById('joinCard').classList.add('hidden');document.getElementById('workspace').classList.remove('hidden');await refresh(true);if(timer)clearInterval(timer);timer=setInterval(()=>refresh(false),6000)}
async function refresh(bottom=false){try{const [r,ms,msgs]=await Promise.all([call(`/chat-rooms/${room.id}`),call(`/chat-rooms/${room.id}/members`),call(`/chat-rooms/${room.id}/messages?limit=120`)]);room=r;members=ms.items||[];document.getElementById('roomTitle').textContent=room.title;document.getElementById('roomDescription').textContent=room.description||`${room.member_count} 位成员参与`;document.getElementById('tokenExpiry').textContent=(auth.expires_at||'').slice(0,16);renderMembers();renderMessages(msgs.items||[],bottom);const last=(msgs.items||[]).at(-1);if(last)await call(`/chat-rooms/${room.id}/read`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message_id:last.id})})}catch(e){document.getElementById('stream').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function renderMembers(){document.getElementById('members').innerHTML=members.map(m=>`<div class="member"><div class="avatar">${m.member_type==='agent'?'AI':esc(m.display_name.slice(0,1))}</div><div class="member-copy"><strong>${esc(m.display_name)}</strong><span>${m.role==='owner'?'房主':'成员'}</span></div><span class="tag">${m.member_type.toUpperCase()}</span></div>`).join('');document.getElementById('mentions').innerHTML=`<button class="chip ${selected.has('all')?'selected':''}" onclick="mention('all')">@ 所有人</button>`+members.filter(m=>m.id!==member.id).map(m=>`<button class="chip ${selected.has(m.id)?'selected':''}" onclick="mention(${m.id})">@ ${esc(m.display_name)}</button>`).join('')}
function mention(id){if(id==='all'){selected.clear();selected.add('all')}else{selected.delete('all');selected.has(id)?selected.delete(id):selected.add(id)}renderMembers()}
function renderMessages(items,bottom){const s=document.getElementById('stream'),near=s.scrollHeight-s.scrollTop<=s.clientHeight+70,previousTop=s.scrollTop;const signature=JSON.stringify(items.map(m=>[m.id,m.created_at,m.content,m.mentions,m.sender?.display_name]));if(signature===renderedMessageSignature){if(bottom)s.scrollTop=s.scrollHeight;return}renderedMessageSignature=signature;if(!items.length){s.innerHTML='<div class="empty">频道已建立，发送第一条消息开始协作。</div>';return}s.innerHTML=items.map(m=>{const mine=m.sender_member_id===member.id,n=m.sender?.display_name||'未知成员',glyph=m.sender?.member_type==='agent'?'AI':n.slice(0,1),mention=(m.mentions||[]).map(x=>x.type==='all'?'@所有人':`@${members.find(mm=>mm.id===x.member_id)?.display_name||'成员'}`).join(' ');return `<div class="msg ${mine?'mine':''}"><div class="avatar">${esc(glyph)}</div><div class="body"><div class="meta">${esc(n)} · ${esc((m.created_at||'').slice(5,16))}</div><div class="bubble">${mention?`<b style="color:#7ce3d0">${esc(mention)}</b>\n`:''}${esc(m.content)}</div></div></div>`}).join('');if(bottom||near)s.scrollTop=s.scrollHeight;else s.scrollTop=Math.min(previousTop,Math.max(0,s.scrollHeight-s.clientHeight))}
async function sendMessage(){const input=document.getElementById('composer'),content=input.value.trim(),button=document.getElementById('sendButton');if(!content)return;button.disabled=true;try{const mentions=[...selected].map(v=>v==='all'?{type:'all'}:{type:'member',member_id:v}),key=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;await call(`/chat-rooms/${room.id}/messages`,{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify({content,mentions})});input.value='';selected.clear();await refresh(true)}catch(e){alert('发送失败：'+e.message)}finally{button.disabled=false}}
document.getElementById('composer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});bootstrap();
</script>
</body></html>
