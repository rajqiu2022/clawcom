<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Hub - 通信中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 24px; color: #fff; }
        .header .subtitle { color: rgba(255,255,255,0.8); font-size: 14px; }
        .stats-bar {
            display: flex;
            gap: 30px;
            background: rgba(255,255,255,0.1);
            padding: 15px 30px;
            border-radius: 10px;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 28px; font-weight: bold; color: #fff; }
        .stat-label { font-size: 12px; color: rgba(255,255,255,0.7); }

        .container { max-width: 1400px; margin: 0 auto; padding: 30px 40px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #2a2a4a;
        }
        .card h3 {
            font-size: 16px;
            color: #888;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Agent 列表 */
        .agent-list { display: flex; flex-direction: column; gap: 12px; }
        .agent-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #252540;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .agent-item:hover { background: #2a2a50; }
        .agent-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }
        .agent-info { flex: 1; }
        .agent-name { font-weight: 600; color: #fff; }
        .agent-meta { font-size: 12px; color: #666; }
        .agent-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .status-online { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
        .status-busy { background: #facc15; box-shadow: 0 0 8px #facc15; }
        .status-offline { background: #666; }

        /* 消息列表 */
        .message-list { display: flex; flex-direction: column; gap: 12px; }
        .message-item {
            padding: 12px;
            background: #252540;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }
        .message-item.unread { border-left-color: #4ade80; }
        .message-sender { font-weight: 600; color: #667eea; font-size: 14px; }
        .message-content { margin-top: 6px; color: #ccc; font-size: 14px; }
        .message-time { font-size: 11px; color: #555; margin-top: 6px; }

        /* 快速操作 */
        .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .action-btn {
            padding: 16px;
            background: #252540;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: #3a3a5a;
            border-color: #667eea;
        }
        .action-btn.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            width: 500px;
            max-width: 90%;
            border: 1px solid #3a3a5a;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 { color: #fff; font-size: 18px; }
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #888;
            font-size: 14px;
        }
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #252540;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        .btn-secondary { background: #3a3a5a; color: #fff; }

        /* 在线 Agent */
        .online-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .online-agent {
            padding: 16px;
            background: #252540;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #3a3a5a;
            transition: all 0.2s;
        }
        .online-agent:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .online-agent .avatar {
            width: 50px;
            height: 50px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .online-agent .name { font-weight: 600; color: #fff; }
        .online-agent .role { font-size: 12px; color: #888; }
        .online-agent .project { font-size: 11px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🔗 Agent Hub</h1>
            <div class="subtitle">OpenClaw 通信中心 | 端口 5232</div>
        </div>
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="stat-total">-</div>
                <div class="stat-label">总 Agent</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-online">-</div>
                <div class="stat-label">在线</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-busy">-</div>
                <div class="stat-label">忙碌</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-unread">-</div>
                <div class="stat-label">未读消息</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="grid">
            <!-- 在线 Agent -->
            <div class="card" style="grid-column: span 2;">
                <h3>🟢 在线 Agent</h3>
                <div class="online-grid" id="online-agents">
                    <div style="color:#666;text-align:center;grid-column:span 2;">加载中...</div>
                </div>
            </div>

            <!-- 快速操作 -->
            <div class="card">
                <h3>⚡ 快速操作</h3>
                <div class="quick-actions">
                    <button class="action-btn primary" onclick="openSendModal()">📨 发消息</button>
                    <button class="action-btn" onclick="refreshData()">🔄 刷新</button>
                    <button class="action-btn" onclick="location.href='/agents'">👥 Agent管理</button>
                    <button class="action-btn" onclick="location.href='/conversations'">💬 会话中心</button>
                </div>
            </div>
        </div>

        <!-- 最近消息 -->
        <div class="card" style="margin-top: 20px;">
            <h3>📬 最近消息</h3>
            <div class="message-list" id="recent-messages">
                <div style="color:#666;text-align:center;padding:20px;">加载中...</div>
            </div>
        </div>
    </div>

    <!-- 发消息模态框 -->
    <div class="modal" id="send-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📨 发送消息</h3>
                <button class="modal-close" onclick="closeSendModal()">&times;</button>
            </div>
            <form id="send-form">
                <div class="form-group">
                    <label>发送给 (Agent ID 或 Key)</label>
                    <input type="number" id="receiver-id" placeholder="输入 Agent ID" required>
                </div>
                <div class="form-group">
                    <label>消息类型</label>
                    <select id="msg-type">
                        <option value="text">文本消息</option>
                        <option value="task_delegate">任务委派</option>
                        <option value="knowledge_share">知识分享</option>
                        <option value="request_help">请求帮助</option>
                        <option value="report">工作汇报</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>消息内容</label>
                    <textarea id="msg-content" placeholder="输入消息内容..." required></textarea>
                </div>
                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeSendModal()">取消</button>
                    <button type="submit" class="btn btn-primary">发送</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        // 加载统计数据
        async function loadStats() {
            const res = await fetch(`${API_BASE}/stats`);
            const data = await res.json();
            document.getElementById('stat-total').textContent = data.total_agents;
            document.getElementById('stat-online').textContent = data.online;
            document.getElementById('stat-busy').textContent = data.busy;
            document.getElementById('stat-unread').textContent = data.total_unread;
        }

        // 加载在线 Agent
        async function loadOnlineAgents() {
            const res = await fetch(`${API_BASE}/agents/online`);
            const agents = await res.json();
            const container = document.getElementById('online-agents');

            if (agents.length === 0) {
                container.innerHTML = '<div style="color:#666;text-align:center;grid-column:span 2;">暂无在线 Agent</div>';
                return;
            }

            container.innerHTML = agents.map(a => `
                <div class="online-agent" onclick="openSendTo(${a.id}, '${a.name}')">
                    <div class="avatar">${a.name.charAt(0).toUpperCase()}</div>
                    <div class="name">${a.name}</div>
                    <div class="role">${getRoleName(a.role)}</div>
                    <div class="project">${a.project_name || '未分配项目'}</div>
                </div>
            `).join('');
        }

        function getRoleName(role) {
            const names = {
                'admin': '管理员',
                'test_manager': '测试经理',
                'test_member': '测试成员',
                'test_executor': '测试执行'
            };
            return names[role] || role;
        }

        // 加载最近消息
        async function loadRecentMessages() {
            const res = await fetch(`${API_BASE}/stats`);
            const stats = await res.json();

            if (stats.total_unread === 0) {
                document.getElementById('recent-messages').innerHTML =
                    '<div style="color:#666;text-align:center;padding:20px;">暂无未读消息 🎉</div>';
                return;
            }

            // 获取所有在线 agent 的未读消息
            const res2 = await fetch(`${API_BASE}/agents/online`);
            const agents = await res2.json();

            let allMessages = [];
            for (const agent of agents) {
                const r = await fetch(`${API_BASE}/messages/inbox/${agent.id}/unread`);
                const msgs = await r.json();
                allMessages = allMessages.concat(msgs);
            }

            allMessages.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const recent = allMessages.slice(0, 10);

            const container = document.getElementById('recent-messages');
            if (recent.length === 0) {
                container.innerHTML = '<div style="color:#666;text-align:center;padding:20px;">暂无未读消息 🎉</div>';
                return;
            }

            container.innerHTML = recent.map(m => `
                <div class="message-item ${m.status === 'unread' ? 'unread' : ''}">
                    <div class="message-sender">${m.sender_name} (${m.sender_key})</div>
                    <div class="message-content">${escapeHtml(m.content.substring(0, 100))}${m.content.length > 100 ? '...' : ''}</div>
                    <div class="message-time">${formatTime(m.created_at)} · ${getTypeName(m.msg_type)}</div>
                </div>
            `).join('');
        }

        function getTypeName(type) {
            const names = {
                'text': '文本',
                'task_delegate': '任务委派',
                'knowledge_share': '知识分享',
                'request_help': '请求帮助',
                'report': '汇报'
            };
            return names[type] || type;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(isoString) {
            const d = new Date(isoString);
            const now = new Date();
            const diff = (now - d) / 1000;
            if (diff < 60) return '刚刚';
            if (diff < 3600) return `${Math.floor(diff/60)}分钟前`;
            if (diff < 86400) return `${Math.floor(diff/3600)}小时前`;
            return d.toLocaleDateString();
        }

        // 发送消息模态框
        function openSendModal() {
            document.getElementById('send-modal').classList.add('active');
            document.getElementById('receiver-id').value = '';
            document.getElementById('msg-content').value = '';
        }

        function openSendTo(agentId, agentName) {
            document.getElementById('send-modal').classList.add('active');
            document.getElementById('receiver-id').value = agentId;
            document.getElementById('receiver-id').placeholder = `${agentId} (${agentName})`;
        }

        function closeSendModal() {
            document.getElementById('send-modal').classList.remove('active');
        }

        document.getElementById('send-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            // 注意：这里需要 Agent Token 才能发送
            // 演示模式下暂时禁用
            alert('发送消息需要提供 Agent API Token。请通过 Agent 客户端使用 Token 认证发送。');
            closeSendModal();
        });

        function refreshData() {
            loadStats();
            loadOnlineAgents();
            loadRecentMessages();
        }

        // 初始化
        loadStats();
        loadOnlineAgents();
        loadRecentMessages();

        // 每30秒刷新一次
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
