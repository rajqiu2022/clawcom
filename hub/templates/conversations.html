<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会话中心 - Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 20px; color: #fff; }
        .header a { color: rgba(255,255,255,0.8); text-decoration: none; margin-right: 20px; }

        .main { flex: 1; display: flex; overflow: hidden; }

        /* 左侧会话列表 */
        .conv-list {
            width: 320px;
            background: #1a1a2e;
            border-right: 1px solid #2a2a4a;
            overflow-y: auto;
        }
        .conv-list-header {
            padding: 16px;
            border-bottom: 1px solid #2a2a4a;
            font-weight: 600;
            color: #888;
            font-size: 13px;
        }
        .conv-item {
            padding: 14px 16px;
            border-bottom: 1px solid #2a2a4a;
            cursor: pointer;
            transition: background 0.2s;
        }
        .conv-item:hover { background: #252540; }
        .conv-item.active { background: #252540; border-left: 3px solid #667eea; }
        .conv-item-header { display: flex; justify-content: space-between; align-items: center; }
        .conv-name { font-weight: 600; color: #fff; }
        .conv-time { font-size: 11px; color: #555; }
        .conv-preview { font-size: 13px; color: #666; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .unread-badge {
            background: #4ade80;
            color: #000;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }

        /* 右侧聊天区 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #16162a;
        }
        .chat-header {
            padding: 16px 24px;
            background: #1a1a2e;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 { color: #fff; }
        .chat-header .role-tag {
            font-size: 12px;
            padding: 4px 10px;
            background: rgba(102,126,234,0.2);
            color: #667eea;
            border-radius: 12px;
            margin-left: 10px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }
        .chat-empty {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }

        .msg {
            margin-bottom: 16px;
            max-width: 70%;
        }
        .msg.sent { margin-left: 30%; }
        .msg.received { margin-right: 30%; }
        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
        }
        .msg.sent .msg-bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-bottom-right-radius: 4px;
        }
        .msg.received .msg-bubble {
            background: #252540;
            border-bottom-left-radius: 4px;
        }
        .msg-time {
            font-size: 11px;
            color: #555;
            margin-top: 6px;
            text-align: center;
        }
        .msg-type {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        .chat-input {
            padding: 16px 24px;
            background: #1a1a2e;
            border-top: 1px solid #2a2a4a;
            display: flex;
            gap: 12px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            background: #252540;
            border: 1px solid #3a3a5a;
            border-radius: 24px;
            color: #fff;
            font-size: 14px;
        }
        .chat-input button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 24px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💬 会话中心</h1>
        <div>
            <a href="/">← 返回首页</a>
            <a href="/agents">Agent 管理</a>
        </div>
    </div>

    <div class="main">
        <div class="conv-list">
            <div class="conv-list-header">📱 在线 Agent</div>
            <div id="online-list">加载中...</div>
            <div class="conv-list-header" style="margin-top:20px;">💬 会话列表</div>
            <div id="conv-list">加载中...</div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <h3 id="chat-title">选择会话</h3>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="chat-empty">👈 选择一个 Agent 开始对话</div>
            </div>
            <div class="chat-input">
                <input type="text" id="msg-input" placeholder="输入消息... (需要 Agent Token)" disabled>
                <button onclick="sendChatMsg()" disabled>发送</button>
            </div>
        </div>
    </div>

    <script>
        const API = '/api';
        let onlineAgents = [];
        let currentOtherId = null;
        let currentAgentId = null;

        async function loadOnlineAgents() {
            const res = await fetch(`${API}/agents/online`);
            onlineAgents = await res.json();
            renderOnlineList();
        }

        function renderOnlineList() {
            const container = document.getElementById('online-list');
            if (onlineAgents.length === 0) {
                container.innerHTML = '<div style="padding:16px;color:#555;font-size:13px;">暂无在线 Agent</div>';
                return;
            }
            container.innerHTML = onlineAgents.map(a => `
                <div class="conv-item" onclick="startChat(${a.id}, '${a.name}', '${a.role}')">
                    <div class="conv-item-header">
                        <span class="conv-name">${a.name}</span>
                        <span class="status-dot status-online"></span>
                    </div>
                    <div class="conv-preview">${getRoleName(a.role)} · ${a.project_name || '未分配项目'}</div>
                </div>
            `).join('');
        }

        function getRoleName(role) {
            const names = {
                'admin': '管理员',
                'test_manager': '测试经理',
                'test_member': '测试成员',
                'test_executor': '测试执行'
            };
            return names[role] || role;
        }

        function startChat(otherId, otherName, otherRole) {
            currentOtherId = otherId;
            document.getElementById('chat-title').innerHTML =
                `${otherName} <span class="role-tag">${getRoleName(otherRole)}</span>`;

            // 高亮选中
            document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.conv-item').classList.add('active');

            // 启用输入框
            document.getElementById('msg-input').disabled = false;
            document.querySelector('.chat-input button').disabled = false;

            // 加载对话历史（需要一个测试 Agent ID）
            // 这里需要选择一个当前 Agent 来查看对话
            loadConversation(otherId);
        }

        async function loadConversation(otherId) {
            // 找一个在线的 Agent 作为当前 Agent
            if (onlineAgents.length === 0) {
                document.getElementById('chat-messages').innerHTML =
                    '<div class="chat-empty">需要至少一个在线 Agent 作为发送方</div>';
                return;
            }
            currentAgentId = onlineAgents[0].id;

            const res = await fetch(`${API}/messages/conversation/${currentAgentId}/${otherId}`);
            const messages = await res.json();
            renderMessages(messages);
        }

        function renderMessages(messages) {
            const container = document.getElementById('chat-messages');
            if (messages.length === 0) {
                container.innerHTML = '<div class="chat-empty">暂无消息记录，开始对话吧！</div>';
                return;
            }
            container.innerHTML = messages.map(m => {
                const isSent = m.sender_id === currentAgentId;
                return `
                <div class="msg ${isSent ? 'sent' : 'received'}">
                    <div class="msg-type">${getTypeName(m.msg_type)}</div>
                    <div class="msg-bubble">${escapeHtml(m.content)}</div>
                    <div class="msg-time">${formatTime(m.created_at)}</div>
                </div>
            `}).join('');
            container.scrollTop = container.scrollHeight;
        }

        function getTypeName(type) {
            const names = {
                'text': '文本',
                'task_delegate': '任务委派',
                'knowledge_share': '知识分享',
                'request_help': '请求帮助',
                'report': '汇报'
            };
            return names[type] || type;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleTimeString();
        }

        function sendChatMsg() {
            alert('发送消息需要提供 Agent API Token。请通过 Agent 客户端发送。');
        }

        loadOnlineAgents();
    </script>
</body>
</html>
